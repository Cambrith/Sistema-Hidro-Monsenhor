<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão — Hidro Monsenhor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #14213d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .cartao {
      max-width: 360px;
    }
    .icone {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #eef4ff;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #004094;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #4b5563;
      margin: 0 0 24px;
    }
    button {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #004094;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      cursor: pointer;
    }
    button:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="cartao">
    <div class="icone">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#004094" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Você está sem internet</h1>
    <p>Verifique sua conexão Wi-Fi ou dados móveis e tente novamente.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
